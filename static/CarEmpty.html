<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>車位資訊</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      font-size: 18px; 
      padding: 10px;
    }
    .table-container {
      width: 100%;
      overflow-x: auto; /* 允許橫向滑動 */
      max-height: 400px; /* 限制高度，方便測試垂直滾動 */
    }
    table { 
      border-collapse: collapse; 
      width: 100%; 
      margin-top: 20px; 
      font-size: 18px; 
      min-width: 400px; 
    }
    th, td { 
      border: 1px solid #ccc; 
      padding: 12px; 
      text-align: left; 
      white-space: nowrap; 
    }
    th { 
      background-color: #f2f2f2; 
      position: sticky;   /* 固定表頭 */
      top: 0;             /* 固定在容器頂端 */
      z-index: 2;         /* 確保在內容上方 */
    }
    td:first-child, th:first-child {
      position: sticky;   /* 固定第一欄 */
      left: 0;            /* 固定在容器左側 */
      background-color: #fff; /* 避免透明造成重疊 */
      z-index: 1;         /* 確保在其他欄位上方 */
    }
    th:first-child {
      z-index: 3; /* 表頭第一欄要更高層級，避免被蓋住 */
    }
    #lastUpdate, #countdown, #totalEmpty { 
      margin-top: 12px; 
      font-size: 16px; 
      color: #333; 
    }
    .highlight { 
      background-color: #ffcccc; 
      font-weight: bold; 
    }

    /* 手機響應式設計 */
    @media (max-width: 600px) {
      body { font-size: 20px; }
      table { font-size: 20px; }
      th, td { padding: 14px; }
    }
  </style>
</head>
<body>
  <h1>陽明山停車場即時資訊</h1>
  <div class="table-container">
    <table id="parkingTable">
      <thead>
        <tr>
          <th>名稱</th>
          <th>剩餘車位</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="lastUpdate">最後更新時間：尚未更新</div>
  <div id="countdown">下次更新剩餘秒數：30</div>
  <div id="totalEmpty">總剩餘車位數：尚未計算</div>

  <script>
    const siteIds = [40908, 40909, 40910, 40911, 40912];
    const tableBody = document.querySelector("#parkingTable tbody");
    const lastUpdateDiv = document.getElementById("lastUpdate");
    const countdownDiv = document.getElementById("countdown");
    const totalEmptyDiv = document.getElementById("totalEmpty");
    let countdown = 30;
    let countdownTimer;

    async function fetchData() {
      tableBody.innerHTML = ""; 
      let totalEmpty = 0;

      for (const id of siteIds) {
        try {
          const response = await fetch(`https://ymsnpapi.altob.com.tw/api/Map/Get?siteId=${id}`);
          const data = await response.json();
          const row = document.createElement("tr");
          const nameCell = document.createElement("td");
          const carEmptyCell = document.createElement("td");

          nameCell.textContent = data.name || "未知";
          carEmptyCell.textContent = data.carEmpty ?? "N/A";

          if (typeof data.carEmpty === "number" && data.carEmpty < 5) {
            row.classList.add("highlight");
          }

          if (typeof data.carEmpty === "number") {
            totalEmpty += data.carEmpty;
          }

          row.appendChild(nameCell);
          row.appendChild(carEmptyCell);
          tableBody.appendChild(row);
        } catch (error) {
          console.error("抓取失敗:", error);
        }
      }

      const now = new Date();
      const formatted = now.getFullYear() + "-" +
                        String(now.getMonth() + 1).padStart(2, '0') + "-" +
                        String(now.getDate()).padStart(2, '0') + " " +
                        String(now.getHours()).padStart(2, '0') + ":" +
                        String(now.getMinutes()).padStart(2, '0') + ":" +
                        String(now.getSeconds()).padStart(2, '0');
      lastUpdateDiv.textContent = "最後更新時間：" + formatted;

      totalEmptyDiv.textContent = "總剩餘車位數：" + totalEmpty;

      countdown = 30;
      countdownDiv.textContent = "下次更新剩餘秒數：" + countdown;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(countdownTimer);
        }
        countdownDiv.textContent = "下次更新剩餘秒數：" + countdown;
      }, 1000);
    }

    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
