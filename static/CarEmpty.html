<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>車位資訊</title>
  <style>
    /* 基準字體大小：隨螢幕寬度縮放，最小16px，最大32px */
    html {
      font-size: clamp(16px, 4vw, 32px);
    }

    body { 
      font-family: Arial, sans-serif; 
      font-size: 1rem; /* 相對於 html 的字體大小 */
      padding: 1em;
    }

    .table-container {
      width: 100%;
      overflow-x: auto; /* 允許橫向滑動 */
      max-height: 60vh; /* 限制高度，方便垂直滾動 */
    }

    table { 
      border-collapse: collapse; 
      width: 100%; 
      margin-top: 1em; 
      font-size: 1.2rem; /* 表格字體比正文稍大 */
      min-width: 300px; 
    }

    th, td { 
      border: 1px solid #ccc; 
      padding: 0.5em; 
      text-align: left; 
      white-space: nowrap; 
    }

    th { 
      background-color: #f2f2f2; 
      position: sticky; 
      top: 0; 
      z-index: 2; 
    }

    td:first-child, th:first-child {
      position: sticky;
      left: 0;
      background-color: #fff;
      z-index: 1;
    }

    th:first-child {
      z-index: 3;
    }

    #lastUpdate, #countdown, #totalEmpty { 
      margin-top: 0.8em; 
      font-size: 0.9rem; 
      color: #333; 
    }

    .highlight { 
      background-color: #ffcccc; 
      font-weight: bold; 
    }
  </style>
</head>
<body>
  <h1>陽明山停車場即時資訊</h1>
  <div class="table-container">
    <table id="parkingTable">
      <thead>
        <tr>
          <th>名稱</th>
          <th>剩餘車位</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="lastUpdate">最後更新時間：尚未更新</div>
  <div id="countdown">下次更新剩餘秒數：30</div>
  <div id="totalEmpty">總剩餘車位數：尚未計算</div>

  <script>
    const siteIds = [40908, 40909, 40910, 40911, 40912];
    const tableBody = document.querySelector("#parkingTable tbody");
    const lastUpdateDiv = document.getElementById("lastUpdate");
    const countdownDiv = document.getElementById("countdown");
    const totalEmptyDiv = document.getElementById("totalEmpty");
    let countdown = 30;
    let countdownTimer;

    async function fetchData() {
      tableBody.innerHTML = ""; 
      let totalEmpty = 0;

      for (const id of siteIds) {
        try {
          const response = await fetch(`https://ymsnpapi.altob.com.tw/api/Map/Get?siteId=${id}`);
          const data = await response.json();
          const row = document.createElement("tr");
          const nameCell = document.createElement("td");
          const carEmptyCell = document.createElement("td");

          nameCell.textContent = data.name || "未知";
          carEmptyCell.textContent = data.carEmpty ?? "N/A";

          if (typeof data.carEmpty === "number" && data.carEmpty < 5) {
            row.classList.add("highlight");
          }

          if (typeof data.carEmpty === "number") {
            totalEmpty += data.carEmpty;
          }

          row.appendChild(nameCell);
          row.appendChild(carEmptyCell);
          tableBody.appendChild(row);
        } catch (error) {
          console.error("抓取失敗:", error);
        }
      }

      const now = new Date();
      const formatted = now.getFullYear() + "-" +
                        String(now.getMonth() + 1).padStart(2, '0') + "-" +
                        String(now.getDate()).padStart(2, '0') + " " +
                        String(now.getHours()).padStart(2, '0') + ":" +
                        String(now.getMinutes()).padStart(2, '0') + ":" +
                        String(now.getSeconds()).padStart(2, '0');
      lastUpdateDiv.textContent = "最後更新時間：" + formatted;

      totalEmptyDiv.textContent = "總剩餘車位數：" + totalEmpty;

      countdown = 30;
      countdownDiv.textContent = "下次更新剩餘秒數：" + countdown;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(countdownTimer);
        }
        countdownDiv.textContent = "下次更新剩餘秒數：" + countdown;
      }, 1000);
    }

    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
